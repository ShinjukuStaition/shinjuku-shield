name: Move npm latest to the stable pin

# The owner confirms a pin after its version is already on npm under the tag next. This moves latest of all three
# names (shinjuku-shield, shinjuku-shielded and the shinjuku command) to that version with no new publish. npm trusted
# publishing (OIDC) covers npm publish only, so a dist-tag change uses the NPM_TOKEN repository secret.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The npm version the owner confirmed as the pin (x.y.z). The site must name its wallet release as the current one."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  latest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      SITE: https://shinjukustaition.com
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Check that this version carries the release the site serves now (the pin)
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::version must be x.y.z"; exit 1; }
          curl -fsS --proto '=https' --tlsv1.2 "$SITE/api/wallet/release" -o "$RUNNER_TEMP/release.json"
          served_sha=$(jq -r '.wallet.sha256' "$RUNNER_TEMP/release.json")
          [[ "$served_sha" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the site names no wallet sha256"; exit 1; }
          for pkg in shinjuku-shielded shinjuku-shield; do
            sha=$(npm view "$pkg@$VERSION" shinjukuSha256)
            [[ "$sha" == "$served_sha" ]] || { echo "::error::$pkg@$VERSION carries $sha, the site serves $served_sha"; exit 1; }
          done
          dep=$(npm view "shinjuku@$VERSION" dependencies.shinjuku-shield)
          [[ "$dep" == "$VERSION" ]] || { echo "::error::shinjuku@$VERSION runs shinjuku-shield $dep, not $VERSION"; exit 1; }

      - name: Move latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in shinjuku-shielded shinjuku-shield shinjuku; do
            npm dist-tag add "$pkg@$VERSION" latest
          done
          for pkg in shinjuku-shielded shinjuku-shield shinjuku; do
            echo "$pkg $(npm view "$pkg" dist-tags --json | tr -d '\n ')"
          done