name: Publish shinjuku-shield and shinjuku to npm

# One wallet release goes out as shinjuku-shield (npm/package.json), the only package that holds the wallet. Two small
# pointer packages at the same version depend on it at that exact version and run it: the shinjuku command
# (names/shinjuku) and the older name shinjuku-shielded (names/shinjuku-shielded), so apps and installs that name the
# older name keep working and updating. shinjuku-shielded has no `shinjuku` bin, so a machine with both installed
# globally has one `shinjuku` command file. Each name has its npm Trusted Publisher on this file.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Wallet release (sha8). latest: the release /api/wallet/release of the site serves now (the pin). next: a release the site serves at /wallet/<sha8>/ (a candidate beside the pin)."
        required: true
        type: string
      version:
        description: "npm version for this release (x.y.z, higher than the last published version)"
        required: true
        type: string
      dist_tag:
        description: "npm dist-tag. latest = the stable pin, only for a version the owner confirmed as the pin; next = any other release"
        required: true
        default: next
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    # The npm listing wait below may take up to 15 minutes by itself (its own step limit is 17).
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: npm
    env:
      RELEASE: ${{ inputs.release }}
      VERSION: ${{ inputs.version }}
      SITE: https://shinjukustaition.com
      DIST_TAG: ${{ inputs.dist_tag }}
      HASH_README_API: https://api.github.com/repos/ShinjukuStaition/shinjuku-shield/readme
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: npm with trusted publishing (OIDC needs npm 11.5.1 or later)
        run: npm install -g npm@11.13.0 && npm --version

      - name: Check inputs
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^[0-9a-f]{8}$ ]] || { echo "::error::release must be 8 lowercase hex characters"; exit 1; }
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::version must be x.y.z"; exit 1; }
          # A rerun after a partial run publishes only the packages still missing (each publish step skips one that is
          # there); a version that all three names already have is refused.
          have=0
          for pkg in shinjuku-shielded shinjuku-shield shinjuku; do
            if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then echo "$pkg@$VERSION is already published"; have=$((have + 1)); fi
          done
          [[ "$have" -lt 3 ]] || { echo "::error::all three packages already have $VERSION"; exit 1; }

      - name: Read the hash from the facilitator and from the GitHub Releases table
        id: hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every curl in this file has a time limit and retries: one stalled download (2026-10-28) waited until
          # the job limit cancelled the run.
          if [[ "$DIST_TAG" == "latest" ]]; then
            # The pin: the release the site names as its current one.
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 60 --retry 3 --retry-all-errors \
              "$SITE/api/wallet/release" -o "$RUNNER_TEMP/release.json"
            served_dir=$(jq -r '.wallet.dir' "$RUNNER_TEMP/release.json")
            served_sha=$(jq -r '.wallet.sha256' "$RUNNER_TEMP/release.json")
            served_bytes=$(jq -r '.wallet.bytes' "$RUNNER_TEMP/release.json")
            [[ "$served_dir" == "$RELEASE" ]] || { echo "::error::the site serves release $served_dir, not $RELEASE"; exit 1; }
          else
            # A candidate: served in its own folder beside the pin; the site's current release stays the pin, so wallets
            # on the pin get no update notice for it.
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 60 --retry 3 --retry-all-errors \
              "$SITE/wallet/$RELEASE/manifest.json" -o "$RUNNER_TEMP/release.json"
            served_sha=$(jq -r '.sha256' "$RUNNER_TEMP/release.json")
            served_bytes=$(jq -r '.bytes' "$RUNNER_TEMP/release.json")
          fi
          [[ "$served_sha" =~ ^[0-9a-f]{64}$ && "$served_sha" == "$RELEASE"* ]] || { echo "::error::site sha256 $served_sha does not start with $RELEASE"; exit 1; }
          [[ "$served_bytes" =~ ^[0-9]+$ ]] || { echo "::error::site bytes is not a number"; exit 1; }

          curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 60 --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            "$HASH_README_API" -o "$RUNNER_TEMP/hash-readme.md"
          # Releases table row: | date | `sha8` or [`sha8`](url) | `sha256` | bytes | ...
          rows=$(awk -F'|' -v tag="\`$RELEASE\`" '/^\|/ && index($3, tag) { print $4 }' "$RUNNER_TEMP/hash-readme.md")
          count=$(printf '%s' "$rows" | grep -c . || true)
          [[ "$count" == "1" ]] || { echo "::error::expected 1 row for $RELEASE in the Releases table of the shinjuku-shield README, found $count"; exit 1; }
          readme_sha=$(printf '%s' "$rows" | grep -oE '[0-9a-f]{64}' || true)
          [[ "$readme_sha" == "$served_sha" ]] || { echo "::error::GitHub table sha256 '$readme_sha' differs from site sha256 $served_sha"; exit 1; }

          echo "sha256=$served_sha" >> "$GITHUB_OUTPUT"
          echo "bytes=$served_bytes" >> "$GITHUB_OUTPUT"

      - name: Download the release files and verify them
        env:
          SHA256: ${{ steps.hash.outputs.sha256 }}
          BYTES: ${{ steps.hash.outputs.bytes }}
        run: |
          set -euo pipefail
          for f in shinjuku-wallet.mjs shinjuku-seller.mjs LICENSE.txt THIRD_PARTY_NOTICES.txt SELLER_THIRD_PARTY_NOTICES.txt manifest.json; do
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 60 --retry 3 --retry-all-errors \
              "$SITE/wallet/$RELEASE/$f" -o "$f"
          done
          echo "$SHA256  shinjuku-wallet.mjs" | sha256sum -c -
          [[ "$(stat -c %s shinjuku-wallet.mjs)" == "$BYTES" ]] || { echo "::error::wallet size differs from the site"; exit 1; }
          [[ "$(jq -r '.sha256' manifest.json)" == "$SHA256" ]] || { echo "::error::manifest.json sha256 differs"; exit 1; }
          [[ "$(jq -r '.license' manifest.json)" == "LicenseRef-Shinjuku-Shielded-Wallet" ]] || { echo "::error::manifest.json license changed"; exit 1; }
          echo "$(jq -r '.notices.sha256' manifest.json)  THIRD_PARTY_NOTICES.txt" | sha256sum -c -
          # The seller library (shinjuku-shield/seller) and its notices, against the manifest of this release.
          [[ "$(jq -r '.seller.file' manifest.json)" == "shinjuku-seller.mjs" ]] || { echo "::error::manifest.json names no seller library"; exit 1; }
          [[ "$(jq -r '.seller.notices.file' manifest.json)" == "SELLER_THIRD_PARTY_NOTICES.txt" ]] || { echo "::error::manifest.json names no seller notices"; exit 1; }
          echo "$(jq -r '.seller.sha256' manifest.json)  shinjuku-seller.mjs" | sha256sum -c -
          echo "$(jq -r '.seller.notices.sha256' manifest.json)  SELLER_THIRD_PARTY_NOTICES.txt" | sha256sum -c -
          [[ "$(stat -c %s shinjuku-seller.mjs)" == "$(jq -r '.seller.bytes' manifest.json)" ]] || { echo "::error::seller library size differs from the manifest"; exit 1; }
          head -n 1 shinjuku-wallet.mjs | grep -qx '#!/usr/bin/env node' || { echo "::error::wallet file has no node shebang"; exit 1; }

      # Fails closed: without the secret, with any match, or when grep cannot run the check (a bad pattern, a file it
      # cannot read: exit 2), nothing is published; only grep's "no match" (exit 1) lets the run go on. The names live
      # only in the secret, so this public file does not list them; grep -l prints file names, never the matched text.
      - name: Refuse private names in the files to publish
        env:
          PRIVATE_NAMES_RE: ${{ secrets.PRIVATE_NAMES_RE }}
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_NAMES_RE:-}" ]] || { echo "::error::the secret PRIVATE_NAMES_RE is not set, so the private-name check cannot run; nothing was published"; exit 1; }
          status=0
          grep -rIilE -- "$PRIVATE_NAMES_RE" . ../names/shinjuku ../names/shinjuku-shielded || status=$?
          case "$status" in
            1) echo "no private names in the files to publish" ;;
            0) echo "::error::the files above name a private account, machine or user; nothing was published"; exit 1 ;;
            *) echo "::error::the private-name check could not run (grep exit $status); nothing was published"; exit 1 ;;
          esac

      - name: Stamp package.json
        env:
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          set -euo pipefail
          npm pkg set "version=$VERSION" "shinjukuRelease=$RELEASE" "shinjukuSha256=$SHA256"
          jq '{name, version, shinjukuRelease, shinjukuSha256, bin}' package.json
          # The README names this exact version in its install lines.
          sed -i "s/{{VERSION}}/$VERSION/g" README.md
          ! grep -n '{{' README.md || { echo "::error::README.md still has a {{ }} token"; exit 1; }

      - name: Smoke test and pack list
        run: |
          set -euo pipefail
          node shinjuku-wallet.mjs help mcp > /dev/null
          node --check seller.mjs
          node --check shinjuku-seller.mjs
          # The name a seller's server imports resolves to the checked file, and the name the two pointers resolve still does.
          try="$RUNNER_TEMP/try-exports"
          mkdir -p "$try/node_modules/shinjuku-shield"
          cp package.json shinjuku-wallet.mjs seller.mjs shinjuku-seller.mjs "$try/node_modules/shinjuku-shield/"
          (cd "$try" && node --input-type=commonjs -e 'for (const [name, file] of [["shinjuku-shield/seller", "seller.mjs"], ["shinjuku-shield/shinjuku-wallet.mjs", "shinjuku-wallet.mjs"]]) { if (require("path").basename(require.resolve(name, { paths: [process.cwd()] })) !== file) throw new Error(name); }')
          [[ "$(jq -r '.exports["./seller"]' package.json)" == "./seller.mjs" ]] || { echo "::error::exports ./seller is not ./seller.mjs"; exit 1; }
          # A text check: loading the library needs the x402 packages, which this job does not install.
          node --input-type=commonjs -e 'const fs = require("fs"); if (!/export\s*\{[^}]*\bcreateShinjukuSeller\b[^}]*\}/.test(fs.readFileSync("shinjuku-seller.mjs", "utf8"))) throw new Error("the seller library does not export createShinjukuSeller"); const loader = fs.readFileSync("seller.mjs", "utf8"); if (!/export async function createShinjukuSeller\b/.test(loader) || !/library\.createShinjukuSeller\(/.test(loader)) throw new Error("seller.mjs does not call createShinjukuSeller");'
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          for f in shinjuku-wallet.mjs seller.mjs shinjuku-seller.mjs SELLER_THIRD_PARTY_NOTICES.txt manifest.json; do
            jq -e --arg f "$f" '.[0].files | any(.path == $f)' "$RUNNER_TEMP/pack.json" > /dev/null || { echo "::error::the package does not hold $f"; exit 1; }
          done
          npm pack --dry-run

      # --loglevel verbose: a refused trusted publisher shows only as E404 on the PUT; the verbose "oidc" line gives
      # npm's reason. npm redacts tokens in its logs.
      - name: Publish shinjuku-shield with provenance (npm trusted publishing; no token)
        run: |
          set -euo pipefail
          # The command users run is `shinjuku`; npx still runs the bin named like the package.
          [[ "$(jq -r '.name' package.json)" == "shinjuku-shield" ]] || { echo "::error::npm/package.json is not shinjuku-shield"; exit 1; }
          for b in shinjuku shinjuku-shield; do
            [[ "$(jq -r --arg b "$b" '.bin[$b]' package.json)" == "shinjuku-wallet.mjs" ]] || { echo "::error::shinjuku-shield has no bin $b"; exit 1; }
          done
          if npm view "shinjuku-shield@$VERSION" version >/dev/null 2>&1; then echo "already published"; exit 0; fi
          npm publish --provenance --access public --tag "$DIST_TAG" --loglevel verbose

      # Both pointer packages below depend on shinjuku-shield at this exact version, so each is published only once npm
      # lists it: a pointer listed first cannot be installed until then (0.3.88: shinjuku listed 23:44:52 UTC,
      # shinjuku-shield 23:45:58 UTC).
      - name: Wait until npm lists shinjuku-shield at this version
        # A backstop only: the loop ends itself after 15 minutes with the error below.
        timeout-minutes: 17
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          try=0
          while :; do
            try=$((try + 1))
            if timeout 30 npm view "shinjuku-shield@$VERSION" version --prefer-online >/dev/null 2>&1; then echo "npm lists shinjuku-shield@$VERSION (check $try)"; exit 0; fi
            [ "$SECONDS" -lt "$deadline" ] || { echo "::error::npm does not list shinjuku-shield@$VERSION after 15 minutes ($try checks), so shinjuku-shielded and shinjuku were not published; run this workflow again"; exit 1; }
            sleep 10
          done

      - name: Publish the older name shinjuku-shielded at the same version (a pointer that runs shinjuku-shield exactly)
        working-directory: names/shinjuku-shielded
        run: |
          set -euo pipefail
          # Before the smoke test, as in the shinjuku step below (a rerun for a version already on npm).
          if npm view "shinjuku-shielded@$VERSION" version >/dev/null 2>&1; then echo "already published"; exit 0; fi
          npm pkg set "version=$VERSION"
          jq --arg v "$VERSION" '.dependencies = {"shinjuku-shield": $v}' package.json > "$RUNNER_TEMP/shinjuku-shielded.json"
          mv "$RUNNER_TEMP/shinjuku-shielded.json" package.json
          jq '{name, version, dependencies, bin}' package.json
          # The bins of the older name (old app configs and global installs run them), all to the pointer file; never
          # `shinjuku`, which only the shinjuku package has.
          [[ "$(jq -c '.bin' package.json)" == '{"shinjuku-shield":"shinjuku-shielded.mjs","shinjuku-shielded":"shinjuku-shielded.mjs","shinjuku-wallet":"shinjuku-shielded.mjs"}' ]] \
            || { echo "::error::shinjuku-shielded must have exactly the bins shinjuku-shield, shinjuku-shielded and shinjuku-wallet"; exit 1; }
          sed -i "s/{{VERSION}}/$VERSION/g" README.md
          ! grep -n '{{' README.md || { echo "::error::README.md still has a {{ }} token"; exit 1; }
          # The smoke test lays out both packages by hand: the packed pointer and the wallet files of this run as
          # shinjuku-shield (the files checked above, not a second download).
          npm pack --pack-destination "$RUNNER_TEMP"
          try="$RUNNER_TEMP/try-shielded/node_modules"
          mkdir -p "$try/shinjuku-shielded" "$try/shinjuku-shield"
          tar -xzf "$RUNNER_TEMP/shinjuku-shielded-$VERSION.tgz" -C "$try/shinjuku-shielded" --strip-components=1
          cp ../../npm/package.json ../../npm/shinjuku-wallet.mjs ../../npm/manifest.json "$try/shinjuku-shield/"
          node "$try/shinjuku-shielded/shinjuku-shielded.mjs" version | tee "$RUNNER_TEMP/version-shielded.txt"
          grep -q "$VERSION" "$RUNNER_TEMP/version-shielded.txt" || { echo "::error::shinjuku-shielded did not run the wallet at $VERSION"; exit 1; }
          npm publish --provenance --access public --tag "$DIST_TAG" --loglevel verbose

      - name: Publish the shinjuku command at the same version, last (it runs shinjuku-shield exactly)
        working-directory: names/shinjuku
        run: |
          set -euo pipefail
          # Before the smoke test: a wallet older than 0.3.81 knows only the name shinjuku-shielded, so its version line
          # under shinjuku-shield fails the test below although shinjuku at that version is already on npm.
          if npm view "shinjuku@$VERSION" version >/dev/null 2>&1; then echo "already published"; exit 0; fi
          npm pkg set "version=$VERSION"
          jq --arg v "$VERSION" '.dependencies = {"shinjuku-shield": $v}' package.json > "$RUNNER_TEMP/shinjuku.json"
          mv "$RUNNER_TEMP/shinjuku.json" package.json
          jq '{name, version, dependencies, bin}' package.json
          sed -i "s/{{VERSION}}/$VERSION/g" README.md
          ! grep -n '{{' README.md || { echo "::error::README.md still has a {{ }} token"; exit 1; }
          # The smoke test lays out both packages by hand: the packed shinjuku and the wallet files of this run as
          # shinjuku-shield (the files checked above, not a second download).
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/try/node_modules/shinjuku" "$RUNNER_TEMP/try/node_modules/shinjuku-shield"
          tar -xzf "$RUNNER_TEMP/shinjuku-$VERSION.tgz" -C "$RUNNER_TEMP/try/node_modules/shinjuku" --strip-components=1
          cp ../../npm/package.json ../../npm/shinjuku-wallet.mjs ../../npm/manifest.json "$RUNNER_TEMP/try/node_modules/shinjuku-shield/"
          node "$RUNNER_TEMP/try/node_modules/shinjuku/shinjuku.mjs" version | tee "$RUNNER_TEMP/version.txt"
          grep -q "$VERSION" "$RUNNER_TEMP/version.txt" || { echo "::error::shinjuku did not run the wallet at $VERSION"; exit 1; }
          npm publish --provenance --access public --tag "$DIST_TAG" --loglevel verbose
