name: Publish shinjuku-shield and shinjuku to npm

# One wallet release goes out as shinjuku-shield (npm/package.json) and as the shinjuku command (names/shinjuku: it runs
# shinjuku-shield at the same exact version). The same files also go out under the older name shinjuku-shielded, so
# wallets installed under that name keep updating; that copy has no `shinjuku` bin, so a machine with both installed
# globally has one `shinjuku` command file. Each name has its npm Trusted Publisher on this file.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Wallet release (sha8). latest: the release /api/wallet/release of the site serves now (the pin). next: a release the site serves at /wallet/<sha8>/ (a candidate beside the pin)."
        required: true
        type: string
      version:
        description: "npm version for this release (x.y.z, higher than the last published version)"
        required: true
        type: string
      dist_tag:
        description: "npm dist-tag. latest = the stable pin, only for a version the owner confirmed as the pin; next = any other release"
        required: true
        default: next
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: npm
    env:
      RELEASE: ${{ inputs.release }}
      VERSION: ${{ inputs.version }}
      SITE: https://shinjukustaition.com
      DIST_TAG: ${{ inputs.dist_tag }}
      HASH_README_API: https://api.github.com/repos/ShinjukuStaition/shinjuku-shield/readme
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: npm with trusted publishing (OIDC needs npm 11.5.1 or later)
        run: npm install -g npm@11.13.0 && npm --version

      - name: Check inputs
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^[0-9a-f]{8}$ ]] || { echo "::error::release must be 8 lowercase hex characters"; exit 1; }
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::version must be x.y.z"; exit 1; }
          # A rerun after a partial run publishes only the packages still missing (each publish step skips one that is
          # there); a version that all three names already have is refused.
          have=0
          for pkg in shinjuku-shielded shinjuku-shield shinjuku; do
            if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then echo "$pkg@$VERSION is already published"; have=$((have + 1)); fi
          done
          [[ "$have" -lt 3 ]] || { echo "::error::all three packages already have $VERSION"; exit 1; }

      - name: Read the hash from the facilitator and from the GitHub Releases table
        id: hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every curl in this file has a time limit and retries: one stalled download (2026-10-28) waited until
          # the job limit cancelled the run.
          if [[ "$DIST_TAG" == "latest" ]]; then
            # The pin: the release the site names as its current one.
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 60 --retry 3 --retry-all-errors \
              "$SITE/api/wallet/release" -o "$RUNNER_TEMP/release.json"
            served_dir=$(jq -r '.wallet.dir' "$RUNNER_TEMP/release.json")
            served_sha=$(jq -r '.wallet.sha256' "$RUNNER_TEMP/release.json")
            served_bytes=$(jq -r '.wallet.bytes' "$RUNNER_TEMP/release.json")
            [[ "$served_dir" == "$RELEASE" ]] || { echo "::error::the site serves release $served_dir, not $RELEASE"; exit 1; }
          else
            # A candidate: served in its own folder beside the pin; the site's current release stays the pin, so wallets
            # on the pin get no update notice for it.
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 60 --retry 3 --retry-all-errors \
              "$SITE/wallet/$RELEASE/manifest.json" -o "$RUNNER_TEMP/release.json"
            served_sha=$(jq -r '.sha256' "$RUNNER_TEMP/release.json")
            served_bytes=$(jq -r '.bytes' "$RUNNER_TEMP/release.json")
          fi
          [[ "$served_sha" =~ ^[0-9a-f]{64}$ && "$served_sha" == "$RELEASE"* ]] || { echo "::error::site sha256 $served_sha does not start with $RELEASE"; exit 1; }
          [[ "$served_bytes" =~ ^[0-9]+$ ]] || { echo "::error::site bytes is not a number"; exit 1; }

          curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 60 --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw" \
            "$HASH_README_API" -o "$RUNNER_TEMP/hash-readme.md"
          # Releases table row: | date | `sha8` or [`sha8`](url) | `sha256` | bytes | ...
          rows=$(awk -F'|' -v tag="\`$RELEASE\`" '/^\|/ && index($3, tag) { print $4 }' "$RUNNER_TEMP/hash-readme.md")
          count=$(printf '%s' "$rows" | grep -c . || true)
          [[ "$count" == "1" ]] || { echo "::error::expected 1 row for $RELEASE in the Releases table of the shinjuku-shield README, found $count"; exit 1; }
          readme_sha=$(printf '%s' "$rows" | grep -oE '[0-9a-f]{64}' || true)
          [[ "$readme_sha" == "$served_sha" ]] || { echo "::error::GitHub table sha256 '$readme_sha' differs from site sha256 $served_sha"; exit 1; }

          echo "sha256=$served_sha" >> "$GITHUB_OUTPUT"
          echo "bytes=$served_bytes" >> "$GITHUB_OUTPUT"

      - name: Download the release files and verify them
        env:
          SHA256: ${{ steps.hash.outputs.sha256 }}
          BYTES: ${{ steps.hash.outputs.bytes }}
        run: |
          set -euo pipefail
          for f in shinjuku-wallet.mjs LICENSE.txt THIRD_PARTY_NOTICES.txt manifest.json; do
            curl -fsS --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 60 --retry 3 --retry-all-errors \
              "$SITE/wallet/$RELEASE/$f" -o "$f"
          done
          echo "$SHA256  shinjuku-wallet.mjs" | sha256sum -c -
          [[ "$(stat -c %s shinjuku-wallet.mjs)" == "$BYTES" ]] || { echo "::error::wallet size differs from the site"; exit 1; }
          [[ "$(jq -r '.sha256' manifest.json)" == "$SHA256" ]] || { echo "::error::manifest.json sha256 differs"; exit 1; }
          [[ "$(jq -r '.license' manifest.json)" == "LicenseRef-Shinjuku-Shielded-Wallet" ]] || { echo "::error::manifest.json license changed"; exit 1; }
          echo "$(jq -r '.notices.sha256' manifest.json)  THIRD_PARTY_NOTICES.txt" | sha256sum -c -
          head -n 1 shinjuku-wallet.mjs | grep -qx '#!/usr/bin/env node' || { echo "::error::wallet file has no node shebang"; exit 1; }

      # Fails closed: without the secret, or with any match, nothing is published. The names live only in the
      # secret, so this public file does not list them; grep -l prints file names, never the matched text.
      - name: Refuse private names in the files to publish
        env:
          PRIVATE_NAMES_RE: ${{ secrets.PRIVATE_NAMES_RE }}
        run: |
          set -euo pipefail
          [[ -n "${PRIVATE_NAMES_RE:-}" ]] || { echo "::error::the secret PRIVATE_NAMES_RE is not set, so the private-name check cannot run; nothing was published"; exit 1; }
          if grep -rIilE -- "$PRIVATE_NAMES_RE" . ../names/shinjuku; then
            echo "::error::the files above name a private account, machine or user; nothing was published"
            exit 1
          fi
          echo "no private names in the files to publish"

      - name: Stamp package.json
        env:
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          set -euo pipefail
          npm pkg set "version=$VERSION" "shinjukuRelease=$RELEASE" "shinjukuSha256=$SHA256"
          jq '{name, version, shinjukuRelease, shinjukuSha256, bin}' package.json
          # The README names this exact version in its install lines.
          sed -i "s/{{VERSION}}/$VERSION/g" README.md
          ! grep -n '{{' README.md || { echo "::error::README.md still has a {{ }} token"; exit 1; }

      - name: Smoke test and pack list
        run: |
          set -euo pipefail
          node shinjuku-wallet.mjs help mcp > /dev/null
          npm pack --dry-run

      # --loglevel verbose: a refused trusted publisher shows only as E404 on the PUT; the verbose "oidc" line gives
      # npm's reason. npm redacts tokens in its logs.
      - name: Publish shinjuku-shield with provenance (npm trusted publishing; no token)
        run: |
          set -euo pipefail
          # The command users run is `shinjuku`; npx still runs the bin named like the package.
          [[ "$(jq -r '.name' package.json)" == "shinjuku-shield" ]] || { echo "::error::npm/package.json is not shinjuku-shield"; exit 1; }
          for b in shinjuku shinjuku-shield; do
            [[ "$(jq -r --arg b "$b" '.bin[$b]' package.json)" == "shinjuku-wallet.mjs" ]] || { echo "::error::shinjuku-shield has no bin $b"; exit 1; }
          done
          if npm view "shinjuku-shield@$VERSION" version >/dev/null 2>&1; then echo "already published"; exit 0; fi
          npm publish --provenance --access public --tag "$DIST_TAG" --loglevel verbose

      - name: Publish the same files under the older name shinjuku-shielded
        run: |
          set -euo pipefail
          # A copy inside the checkout: npm/ stays shinjuku-shield for the shinjuku step below.
          old="$GITHUB_WORKSPACE/npm-shinjuku-shielded"
          rm -rf "$old" && mkdir "$old"
          cp package.json README.md shinjuku-wallet.mjs LICENSE.txt THIRD_PARTY_NOTICES.txt manifest.json "$old/"
          cd "$old"
          npm pkg set "name=shinjuku-shielded" "description=The older npm name of shinjuku-shield (the same files), kept so wallets installed under it keep updating. New installs: npm install -g shinjuku"
          npm pkg delete bin.shinjuku
          [[ "$(jq -r '.bin.shinjuku' package.json)" == "null" ]] || { echo "::error::shinjuku-shielded must not have the shinjuku bin"; exit 1; }
          echo "$(jq -r '.shinjukuSha256' package.json)  shinjuku-wallet.mjs" | sha256sum -c -
          jq '{name, version, shinjukuRelease, shinjukuSha256, bin}' package.json
          if npm view "shinjuku-shielded@$VERSION" version >/dev/null 2>&1; then echo "already published"; exit 0; fi
          npm publish --provenance --access public --tag "$DIST_TAG" --loglevel verbose

      - name: Publish the shinjuku command at the same version, last (it runs shinjuku-shield exactly)
        working-directory: names/shinjuku
        run: |
          set -euo pipefail
          # Before the smoke test: a wallet older than 0.3.81 knows only the name shinjuku-shielded, so its version line
          # under shinjuku-shield fails the test below although shinjuku at that version is already on npm.
          if npm view "shinjuku@$VERSION" version >/dev/null 2>&1; then echo "already published"; exit 0; fi
          npm pkg set "version=$VERSION"
          jq --arg v "$VERSION" '.dependencies = {"shinjuku-shield": $v}' package.json > "$RUNNER_TEMP/shinjuku.json"
          mv "$RUNNER_TEMP/shinjuku.json" package.json
          jq '{name, version, dependencies, bin}' package.json
          sed -i "s/{{VERSION}}/$VERSION/g" README.md
          ! grep -n '{{' README.md || { echo "::error::README.md still has a {{ }} token"; exit 1; }
          # The new wallet version can still be in npm's check (a few minutes), so the smoke test lays out both packages
          # by hand: the packed shinjuku and the wallet files of this run as shinjuku-shield.
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/try/node_modules/shinjuku" "$RUNNER_TEMP/try/node_modules/shinjuku-shield"
          tar -xzf "$RUNNER_TEMP/shinjuku-$VERSION.tgz" -C "$RUNNER_TEMP/try/node_modules/shinjuku" --strip-components=1
          cp ../../npm/package.json ../../npm/shinjuku-wallet.mjs ../../npm/manifest.json "$RUNNER_TEMP/try/node_modules/shinjuku-shield/"
          node "$RUNNER_TEMP/try/node_modules/shinjuku/shinjuku.mjs" version | tee "$RUNNER_TEMP/version.txt"
          grep -q "$VERSION" "$RUNNER_TEMP/version.txt" || { echo "::error::shinjuku did not run the wallet at $VERSION"; exit 1; }
          # Published last, only once npm lists shinjuku-shield at this version: shinjuku depends on that exact version,
          # so a shinjuku listed first cannot be installed until it is (0.3.88: shinjuku listed 23:44:52 UTC,
          # shinjuku-shield 23:45:58 UTC).
          for try in $(seq 1 90); do
            if npm view "shinjuku-shield@$VERSION" version --prefer-online >/dev/null 2>&1; then echo "npm lists shinjuku-shield@$VERSION (check $try)"; break; fi
            [ "$try" -lt 90 ] || { echo "::error::npm does not list shinjuku-shield@$VERSION after 15 minutes, so shinjuku was not published; run this workflow again"; exit 1; }
            sleep 10
          done
          npm publish --provenance --access public --tag "$DIST_TAG" --loglevel verbose
