name: Publish to the MCP Registry

# Manual only. Run after the npm version named in server.json is live:
# the registry checks that the npm package carries the same mcpName.
on:
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC: proves this repo's owner (ShinjukuStaition) to the registry
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install mcp-publisher (one fixed version, checked by sha256)
        env:
          # This job can sign in to the MCP Registry as this repository's owner (id-token: write), so it runs one known
          # build of mcp-publisher, never whatever release is newest. v1.8.7 is the release the last good run used
          # (2026-10-30). The sha256 is copied from the vendor's checksums file of that release,
          # https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/registry_1.8.7_checksums.txt
          # (line mcp-publisher_linux_amd64.tar.gz). A new version: change both lines from that release's checksums file.
          MCP_PUBLISHER_VERSION: v1.8.7
          MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
        run: |
          set -euo pipefail
          # To a file, not a pipe: a retry restarts the download, and tar must not read a stream that started twice.
          curl -fsSL --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 120 --retry 3 --retry-all-errors -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c - || { echo "::error::mcp-publisher $MCP_PUBLISHER_VERSION does not match its pinned sha256; nothing was published"; exit 1; }
          tar xzf mcp-publisher.tar.gz mcp-publisher
          # The whole help text, then its first line: "| head -1" under pipefail fails 141 (SIGPIPE) when head exits first.
          ./mcp-publisher --help > help.txt
          sed -n 1p help.txt

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
